name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate Android App Package
        run: |
          mkdir -p output
          # Genera il pacchetto Android direttamente dal file index.html locale
          pwabuilder generate --path ./index.html --name "80S Gym Log" --shortname "GymLog" --background "#12091f" --theme "#ff007f" --start_url "./index.html" --output ./output || true

      - name: Find and Move APK
        run: |
          mkdir -p final-apk
          find . -name "*.apk" -exec cp {} final-apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: final-apk/*.apk
