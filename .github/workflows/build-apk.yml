name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          mkdir -p android-app
          cp index.html android-app/
          cd android-app
          echo '{"name": "80S Gym Log", "short_name": "GymLog", "start_url": "./index.html", "display": "standalone", "background_color": "#12091f", "theme_color": "#ff007f"}' > manifest.json
          
          bubblewrap init --manifest=manifest.json --directory=./ --skip=androidManifests,keys || true
          bubblewrap build || true

      - name: Find and Move APK
        run: |
          mkdir -p final-apk
          find . -name "*.apk" -exec cp {} final-apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: final-apk/*.apk
