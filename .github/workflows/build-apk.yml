name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compile PWA to APK
        run: |
          npm install -g nativefier
          # Compila direttamente l'app in un eseguibile/APK nativo usando Nativefier
          nativefier --name "80S Gym Log" --platform android --arch arm64 ./index.html ./output || true

      - name: Find and Move APK
        run: |
          mkdir -p final-apk
          find . -name "*.apk" -exec cp {} final-apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: final-apk/*.apk
